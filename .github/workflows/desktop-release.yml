name: ServoERP Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: SOURCE_CODE/HVAC_Pro_Desktop.sln
  PROJECT_PATH: SOURCE_CODE/HVAC_Pro_Desktop.csproj
  APP_ID: ServoERP.Desktop
  APP_TITLE: ServoERP
  MAIN_EXE: HVAC_Pro_Desktop.exe
  BUILD_CONFIGURATION: Release
  PLATFORM: "Any CPU"
  VPK_VERSION: 1.2.0

jobs:
  build-package-release:
    name: Build, Package, Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Stamp CI Version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $line = & .\scripts\Set-ServoVersion.ps1 -Version $base
          $version = ($line | Select-String '^VERSION=').ToString().Replace('VERSION=', '')
          "version=$version" >> $env:GITHUB_OUTPUT
          "SERVO_VERSION=$version" >> $env:GITHUB_ENV

      - name: Validate Release Version
        shell: pwsh
        run: |
          .\scripts\Assert-GitHubReleaseVersion.ps1 `
            -Repository "${{ github.repository }}" `
            -CandidateVersion "$env:SERVO_VERSION" `
            -Token "${{ secrets.GITHUB_TOKEN }}"

      - name: Restore NuGet Packages
        run: nuget restore $env:SOLUTION_PATH

      - name: Verify Restored Packages
        shell: pwsh
        run: |
          $expectedStub = "SOURCE_CODE\packages\Stub.System.Data.SQLite.Core.NetFramework.1.0.118"
          $restoredStub = Get-ChildItem SOURCE_CODE\packages -Directory |
            Where-Object { $_.Name -like "Stub.System.Data.SQLite.Core.NetFramework.1.0.118*" } |
            Sort-Object Name |
            Select-Object -First 1

          if (-not $restoredStub) {
            Get-ChildItem SOURCE_CODE\packages -Directory | Sort-Object Name | Select-Object -ExpandProperty Name
            throw "Stub.System.Data.SQLite.Core.NetFramework was not restored."
          }

          if (-not (Test-Path $expectedStub)) {
            Copy-Item -LiteralPath $restoredStub.FullName -Destination $expectedStub -Recurse -Force
          }

          $sqlite = Join-Path $expectedStub "lib\net46\System.Data.SQLite.dll"
          if (-not (Test-Path $sqlite)) {
            Get-ChildItem $restoredStub.FullName -Recurse -Filter System.Data.SQLite.dll | Select-Object -ExpandProperty FullName
            throw "System.Data.SQLite was not restored at expected path: $sqlite"
          }

      - name: Build Release
        run: >
          msbuild $env:SOLUTION_PATH
          /m
          /t:Rebuild
          /p:Configuration=$env:BUILD_CONFIGURATION
          /p:Platform="$env:PLATFORM"
          /p:OutDir="$env:GITHUB_WORKSPACE\artifacts\build\"

      - name: Run CI Smoke Tests
        shell: pwsh
        run: |
          .\scripts\Invoke-ServoSmokeTests.ps1 `
            -Suite CiSafe `
            -SkipBuild `
            -AppPath "$env:GITHUB_WORKSPACE\artifacts\build\HVAC_Pro_Desktop.exe"

      - name: Prepare Publish Folder
        shell: pwsh
        run: |
          .\scripts\Prepare-VelopackPublish.ps1 `
            -BuildOutput "$env:GITHUB_WORKSPACE\artifacts\build" `
            -PublishDir "$env:GITHUB_WORKSPACE\artifacts\publish"

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\artifacts\publish\$env:MAIN_EXE")) {
            throw "Main executable was not produced: $env:MAIN_EXE"
          }

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version $env:VPK_VERSION

      - name: Download Previous Velopack Release
        shell: pwsh
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --outputDir "$env:GITHUB_WORKSPACE\artifacts\velopack"

      - name: Pack Installer and Updates
        shell: pwsh
        run: >
          vpk pack
          --packId "$env:APP_ID"
          --packTitle "$env:APP_TITLE"
          --packAuthors "Harshal Sonawane"
          --packVersion "$env:SERVO_VERSION"
          --packDir "$env:GITHUB_WORKSPACE\artifacts\publish"
          --outputDir "$env:GITHUB_WORKSPACE\artifacts\velopack"
          --mainExe "$env:MAIN_EXE"
          --icon "$env:GITHUB_WORKSPACE\SOURCE_CODE\app.ico"
          --runtime win-x64
          --exclude "(?i)(^|[\\/])(HVACPro\.config|.*\.servoerp-license|.*\.sqlite|.*\.mdf|.*\.ldf|logs?|database|updates?)([\\/]|$)"

      - name: Verify Velopack Artifacts
        shell: pwsh
        run: |
          .\scripts\Test-VelopackReleaseArtifacts.ps1 `
            -OutputDir "$env:GITHUB_WORKSPACE\artifacts\velopack" `
            -ExpectedVersion "$env:SERVO_VERSION"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ServoERP-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/publish/**
            artifacts/velopack/**

      - name: Publish GitHub Release
        shell: pwsh
        run: >
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --outputDir "$env:GITHUB_WORKSPACE\artifacts\velopack"
          --publish
          --releaseName "ServoERP $env:SERVO_VERSION"
          --tag "v$env:SERVO_VERSION"
          --targetCommitish "${{ github.sha }}"
